name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '/What went wrong/,/Try:/p' build.log | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::error::WWW /'

      - uses: actions/upload-artifact@v4
        with:
          name: ChangeReader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
