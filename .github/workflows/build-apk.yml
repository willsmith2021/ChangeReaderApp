name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '/What went wrong/,/Try:/p' build.log | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::error::WWW /'

      - uses: actions/upload-artifact@v4
        with:
          name: ChangeReader-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator (smoke test)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.rt.changereader android.permission.READ_EXTERNAL_STORAGE
            adb logcat -c
            adb shell am start -W -n com.rt.changereader/.MainActivity --es autostart_path /sdcard/Download --es autostart_root 0
            sleep 8
            adb shell "echo hello > /sdcard/Download/cr_test.txt"
            adb shell "mkdir -p /sdcard/Download/cr_folder && echo x > /sdcard/Download/cr_folder/inner.txt"
            sleep 12
            adb shell "cat /sdcard/Android/data/com.rt.changereader/files/logs/*.csv" > applog.txt || true
            adb logcat -d -b crash > crash.log || true
            adb shell pidof com.rt.changereader > pid.txt || true
            adb root
            sleep 5
            adb wait-for-device
            adb push app/src/main/assets/changereader_watch.sh /data/local/tmp/w.sh
            adb shell "sh /data/local/tmp/w.sh /data/data/com.android.settings 0 3000 > /data/local/tmp/out.txt 2>&1 &"
            sleep 6
            adb shell "echo hi > /data/data/com.android.settings/cr_root_test.txt && mkdir /data/data/com.android.settings/cr_root_dir"
            sleep 4
            adb shell cat /data/local/tmp/out.txt > rootlog.txt || true

      - name: Report launch result
        if: always()
        run: |
          echo "::notice::APPLOG $(head -c 3000 applog.txt 2>/dev/null | tr '\n' ' ')"
          echo "::notice::ROOTLOG $(head -c 3000 rootlog.txt 2>/dev/null | tr '\n' ' ')"
          if [ -s crash.log ]; then
            echo "::error::CRASH $(head -c 3500 crash.log | tr '\n' ' ')"
          elif [ -s pid.txt ]; then
            echo "::notice::LAUNCH_OK app is running (pid $(cat pid.txt))"
          else
            echo "::warning::LAUNCH_UNKNOWN no crash log and no process"
          fi
