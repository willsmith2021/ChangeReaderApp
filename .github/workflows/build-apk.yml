name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '/What went wrong/,/Try:/p' build.log | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::error::WWW /'

      - uses: actions/upload-artifact@v4
        with:
          name: ChangeReader-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator (smoke test)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.rt.changereader/.MainActivity
            sleep 10
            adb logcat -d -b crash > crash.log || true
            adb shell pidof com.rt.changereader > pid.txt || true

      - name: Report launch result
        if: always()
        run: |
          if [ -s crash.log ]; then
            echo "::error::CRASH $(head -c 3500 crash.log | tr '\n' ' ')"
          elif [ -s pid.txt ]; then
            echo "::notice::LAUNCH_OK app is running (pid $(cat pid.txt))"
          else
            echo "::warning::LAUNCH_UNKNOWN no crash log and no process"
          fi
